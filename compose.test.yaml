# PostgreSQL temporal para ejecutar las pruebas de integración en local.
# Datos en memoria (tmpfs): se pierden al detener el contenedor.
services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: isur_test
      POSTGRES_USER: isur_test
      POSTGRES_PASSWORD: test_password
    ports:
      - "54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isur_test -d isur_test"]
      interval: 3s
      timeout: 3s
      retries: 10
