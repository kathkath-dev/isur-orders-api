name: CI

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    # PostgreSQL temporal, limpio en cada ejecución
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: isur_ci
          POSTGRES_USER: isur_ci
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U isur_ci -d isur_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: isur_ci
      DB_USER: isur_ci
      DB_PASSWORD: ci_password
      DB_SSL: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias (npm ci)
        run: npm ci

      - name: Migrar base de datos
        run: npm run migrate

      - name: Pruebas de integración
        run: npm test

      - name: Construir imagen Docker
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t isur-orders-api:ci .
